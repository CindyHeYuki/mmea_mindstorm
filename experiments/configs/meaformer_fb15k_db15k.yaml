# MEAformer baseline config — FB15K-DB15K
model: meaformer
dataset: FB15K-DB15K
data_dir: data/FB15K-DB15K

# Model architecture
hidden_dim: 256
gnn_layers: 2
transformer_layers: 1
num_heads: 4
dropout: 0.1
img_dim: 2048        # ResNet50 pool5 features
txt_dim: 768         # BERT-base [CLS]

# Training
optimizer: adam
lr: 5.0e-4
weight_decay: 1.0e-5
epochs: 1000
batch_size: 1024
neg_num: 25
margin: 1.0
grad_clip: 1.0

# Evaluation
eval_every: 10
hits_k: [1, 5, 10]

# Misc
seed: 42
device: cuda
save_dir: experiments/results/baseline/meaformer_fb15k_db15k
